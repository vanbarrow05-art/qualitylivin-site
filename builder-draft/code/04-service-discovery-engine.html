<div class='service-discovery-engine-wrapper'>
  <style>
    .service-discovery-engine-wrapper {
      width: 100%;
      max-width: 100%;

      position: relative;

    .service-discovery-engine-sticky-box {
      position: sticky;
      top: 90px;
      background: var(--brand-surface);
      border: 1px solid var(--brand-primary);
      border-radius: 6px;
      box-shadow: 0 16px 40px -12px rgba(30, 58, 52, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .service-discovery-engine-map-header {
      padding: 12px 16px;
      background: var(--brand-primary);
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .service-discovery-engine-map-title {
      font-family: var(--headlinefont);
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.02em;
    }
    .service-discovery-engine-live-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #27AE60;
      box-shadow: 0 0 0 4px rgba(39, 174, 96, 0.3);
      display: inline-block;
    }
    .service-discovery-engine-search-btn {
      background: var(--brand-accent);
      color: var(--brand-primary);
      font-family: var(--contentfont);
      font-size: 12px;
      font-weight: 600;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s ease;
    }
    .service-discovery-engine-search-btn:hover {
      opacity: 0.9;
    }
    .service-discovery-engine-canvas-wrap {
      position: relative;
      height: 480px;
      background: #EAE7DE;
      overflow: hidden;
    }
    .service-discovery-engine-svg-map {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .service-discovery-engine-legend {
      padding: 12px 14px;
      background: var(--brand-surface-1);
      border-top: 1px solid rgba(30, 58, 52, 0.15);
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 12px;
      font-family: var(--contentfont);
      font-size: 12px;
      color: var(--brand-text-main);
    }
    .service-discovery-engine-legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .service-discovery-engine-legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .service-discovery-engine-pin {
      position: absolute;
      cursor: pointer;
      transform: translate(-50%, -100%);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }
    .service-discovery-engine-pin:hover, .service-discovery-engine-pin.active {
      transform: translate(-50%, -115%) scale(1.15);
      z-index: 10;
    }
    .service-discovery-engine-popup {
      position: absolute;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: var(--white);
      border: 1px solid var(--brand-primary);
      border-radius: 6px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px rgba(30, 58, 52, 0.18);
      font-family: var(--contentfont);
      z-index: 20;
      display: block;
      animation: sdeFadeIn 0.25s ease;
    }
    @keyframes sdeFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .service-discovery-engine-popup-tag {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--brand-accent);
      margin-bottom: 2px;
    }
    .service-discovery-engine-popup-name {
      font-family: var(--headlinefont);
      font-size: 18px;
      font-weight: 600;
      color: var(--brand-primary);
      margin: 0 0 4px 0;
    }
    .service-discovery-engine-popup-meta {
      font-size: 12px;
      color: var(--brand-text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .service-discovery-engine-popup-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-primary);
      text-decoration: underline;
    }
    .service-discovery-engine-mobile-toggle {
      display: none;
    }
    @media (max-width: 768px) {
      .service-discovery-engine-sticky-box {
        position: static;
      }
      .service-discovery-engine-canvas-wrap {
        height: 380px;
      }
      .service-discovery-engine-mobile-toggle {
        display: flex;
        background: var(--brand-surface-1);
        border: 1px solid var(--brand-primary);
        border-radius: 30px;
        padding: 4px;
        margin-bottom: 14px;
        gap: 4px;
      }
      .service-discovery-engine-toggle-opt {
        flex: 1;
        text-align: center;
        padding: 8px 12px;
        font-family: var(--contentfont);
        font-size: 13px;
        font-weight: 600;
        border-radius: 24px;
        border: none;
        background: transparent;
        color: var(--brand-text-main);
        cursor: pointer;
      }
      .service-discovery-engine-toggle-opt.active {
        background: var(--brand-primary);
        color: var(--white);
      }
    }

  <script>
    const sdeData = {
      1: {
        tag: 'RESIDENTIAL CLEANING & ESTATE CARE',
        name: 'Belgravia Housekeeping & Estate Sanitization',
        meta: '★ 4.98 • 164 Guild Reviews',
        status: '● 3-Hour Dispatch'
      },
      2: {
        tag: 'COMMERCIAL FACILITIES & HVAC',
        name: 'Apex Mechanical & Commercial HVAC',
        meta: '★ 4.95 • 92 VerifiedPro Reviews',
        status: '● 60-Min Triage'
      },
      3: {
        tag: 'HYDRONIC & PRESSURE PLUMBING',
        name: 'Kensington Hydronics & Pipeworks',
        meta: '★ 4.99 • 81 CIBSE Reviews',
        status: '● Priority Fleet Ready'
      },
      4: {
        tag: 'ELECTRICAL & LIGHTING AUTOMATION',
        name: 'Lumina Architectural Electrical',
        meta: '★ 4.94 • 118 NICEIC Reviews',
        status: '● Scheduled Slots'
      }
    };

    function sdeSelectPin(id) {
      for (let i = 1; i <= 4; i++) {
        const p = document.getElementById('pin' + i);
        if (p) p.classList.remove('active');
      }
      const currentPin = document.getElementById('pin' + id);
      if (currentPin) currentPin.classList.add('active');

      const item = sdeData[id];
      if (item) {
        document.getElementById('sdePopupTag').innerText = item.tag;
        document.getElementById('sdePopupName').innerText = item.name;
        document.getElementById('sdePopup').style.display = 'block';
      }
    }

    function sdeSimulateSearch() {
      const btn = document.querySelector('.service-discovery-engine-search-btn');
      if (!btn) return;
      btn.innerText = 'Searching 8 verified...';
      setTimeout(() => {
        btn.innerText = '✓ Zone Updated (8)';
        setTimeout(() => { btn.innerText = '⟳ Search this area'; }, 2000);
      }, 600);
    }

    function sdeSwitchMode(mode) {
      const buttons = document.querySelectorAll('.service-discovery-engine-toggle-opt');
      buttons.forEach(b => b.classList.remove('active'));
      const mapBox = document.getElementById('sdeMapBox');
      if (mode === 'list') {
        if (buttons[0]) buttons[0].classList.add('active');
        if (mapBox) mapBox.scrollIntoView({ behavior: 'smooth', block: 'end' });
      } else {
        if (buttons[1]) buttons[1].classList.add('active');
        if (mapBox) mapBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  </script>
